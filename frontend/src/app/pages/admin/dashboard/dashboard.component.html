<section class="overview">
  <h2>Tableau de bord</h2>
  <p>Vue d’ensemble des pages et de leurs sections éditables.</p>
  <div class="grid">
    <a class="card" *ngFor="let s of stats" [routerLink]="[s.route]">
      <h3>{{ s.name }}</h3>
      <p>{{ s.sections }} sections éditables</p>
      <span class="link">Configurer</span>
    </a>
  </div>
</section>
