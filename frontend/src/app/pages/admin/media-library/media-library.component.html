<div class="media-library-container">
  <div class="header">
    <h2>Media Library</h2>
    <div class="actions">
      <input 
        type="file" 
        #fileInput 
        style="display: none" 
        (change)="onFileSelected($event)"
        accept="image/*,application/pdf"
      >
      <button class="btn btn-primary" (click)="fileInput.click()" [disabled]="isUploading">
        <span *ngIf="!isUploading">+ Upload New</span>
        <span *ngIf="isUploading">Uploading...</span>
      </button>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="uploadError" class="alert alert-danger">{{ uploadError }}</div>

  <div class="media-grid" *ngIf="!isLoading; else loading">
    <div class="media-item" *ngFor="let item of mediaItems">
      <div class="preview">
        <img [src]="item.url" [alt]="item.original_name" *ngIf="item.mime_type.startsWith('image/')">
        <div class="file-icon" *ngIf="!item.mime_type.startsWith('image/')">
          📄 {{ item.mime_type }}
        </div>
      </div>
      <div class="info">
        <span class="filename" title="{{ item.original_name }}">{{ item.original_name }}</span>
        <div class="actions">
          <button class="btn-icon" (click)="copyUrl(item.url)" title="Copy URL">🔗</button>
          <button class="btn-icon delete" (click)="deleteMedia(item.id)" title="Delete">🗑️</button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #loading>
    <div class="loading-spinner">Loading media...</div>
  </ng-template>

  <div *ngIf="!isLoading && mediaItems.length === 0" class="empty-state">
    No media files found. Upload one to get started.
  </div>
</div>
